# PvPad v3 (PVP + PvPadHook) for Sepolia. Builds offline: every import is an ordinary file under lib/.
# No ffi, no filesystem permissions, no external compiler binary. The protected floor suite pins
# solc 0.8.26; v4-core needs the Cancun EVM (transient storage).

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Deterministic creation code: no metadata hash, so the attested bytecode depends only on the
# sources and the compiler settings, never on file paths.
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "solmate/=lib/solmate/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
ignore = ["lib/**", "test/scratch/**"]
